version: '3.8'

services:
  postgis:
    image: postgis/postgis:15-3.4
    container_name: urban_flood_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cX9!vR7y$Z1p}
      POSTGRES_DB: ${POSTGRES_DB:-urban_flood}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
