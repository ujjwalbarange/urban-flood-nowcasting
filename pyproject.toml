[project]
name = "urban-flood-nowcasting"
version = "0.1.0"
description = "SIH26085 — Urban Flood Nowcasting System with Drainage-Rainfall Coupling"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "SIH26085 Team"}
]

dependencies = [
    # API Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",

    # Geospatial
    "geopandas>=1.0.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",

    # Scientific
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "xarray>=2024.6.0",

    # HTTP client
    "httpx>=0.27.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3.0",
    "pytorch-lightning>=2.3.0",
    "h5py>=3.11.0",
    "zarr>=2.18.0",
]
hydrology = [
    "landlab>=2.11.0",
    "pyswmm>=0.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["services*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
