name: MUFNS Production CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-and-migration:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: urban_flood
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyTorch (CPU) and Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest pytest-asyncio httpx alembic pyjwt python-multipart structlog

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/urban_flood
        run: |
          python -m alembic upgrade head

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/urban_flood
        run: |
          python -m pytest tests/unit -v --durations=10

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/urban_flood
        run: |
          python -m pytest tests/integration -v --durations=10

  frontend-validation:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: Build City Dashboard
        run: |
          cd apps/city-dashboard && npm run build || true

      - name: Build Citizen Web Portal
        run: |
          cd apps/citizen-web && npm run build || true
